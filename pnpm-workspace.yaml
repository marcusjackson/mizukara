packages:
  - '.'

allowBuilds:
  esbuild: true
  # Transformers.js pulls onnxruntime-node in, but this app only ever uses
  # the browser (WebGPU) backend, so its native build never needs to run.
  onnxruntime-node: false
  protobufjs: false
  # sharp arrives under onnxruntime-node's tooling; unused in the browser.
  sharp: false
  unrs-resolver: true
  vue-demi: true

# Project Configuration Settings
minimumReleaseAge: 4320
# Security remediation for transitive dependencies — one entry per package line.
# fast-uri <3.1.8 — SSRF, host-confusion and follow-up advisories
#   (GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g, GHSA-hrr3-gc8f-f4qj); reached
#   only via ajv under stylelint.
# brace-expansion 1.x / 2.x — ReDoS advisories (GHSA-6j4f-fj2g-mc7p,
#   GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr); reached via minimatch under
#   eslint-plugin-import and vite-plugin-pwa's workbox-build. Dev-only.
# source-map-js <1.2.2 — event-loop DoS via indexed source-map section offsets;
#   reached via vue's compiler-core. Dev/build-time only.
# adm-zip and sharp arrive under onnxruntime-node's tooling, which this app
# never runs (browser/WebGPU backend only); pinned to patched versions anyway.
overrides:
  adm-zip@<0.6.1: 0.6.1
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  fast-uri@<3.1.8: 3.1.8
  source-map-js@<1.2.2: 1.2.2
  sharp@<0.35.5: 0.35.5
saveExact: true
