# fleet:begin pnpm-workspace-policy sha=9700a7feab | machine-written; edit the source, not this region
packages:
  - '.'

# Project Configuration Settings
minimumReleaseAge: 4320
saveExact: true
# fleet:end pnpm-workspace-policy

allowBuilds:
  esbuild: true
  # Transformers.js pulls onnxruntime-node in, but this app only ever uses
  # the browser (WebGPU) backend, so its native build never needs to run.
  onnxruntime-node: false
  protobufjs: false
  # sharp arrives under onnxruntime-node's tooling; unused in the browser.
  sharp: false
  unrs-resolver: true
  vue-demi: true
