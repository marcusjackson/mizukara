<!doctype html>
<meta charset="utf-8" />
<title>tag-head embedder</title>
<script type="module">
  import {
    pipeline,
    env
  } from '/node_modules/@huggingface/transformers/dist/transformers.js'
  env.allowLocalModels = false
  let loaded = null
  window.api = {
    // Mirrors the app's pipeline: feature extraction on WebAssembly, mean pooling, unit-normalised.
    async embed(model, dtype, texts) {
      if (!loaded) {
        loaded = await pipeline('feature-extraction', model, {
          dtype,
          device: 'wasm'
        })
      }
      const out = []
      for (const text of texts) {
        const r = await loaded(text, { pooling: 'mean', normalize: true })
        out.push(Array.from(r.data))
      }
      return out
    }
  }
  window.ready = true
</script>
